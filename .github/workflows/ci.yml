# 되돌리기 어려운 사고를 사람 손보다 먼저 잡는 자리.
#
# release.yml 과 역할이 다르다. 그쪽은 태그를 밀었을 때 설치본을 만들고,
# 이쪽은 코드를 밀 때마다 깨진 곳이 없는지만 본다.
#
# 판은 release.yml 의 FLUTTER_VERSION 과 같은 값으로 맞춘다. 검사와 배포가
# 다른 판으로 돌면, 여기서 통과한 것이 설치본에서 깨질 수 있다.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: pub get
        run: flutter pub get

      - name: mobile release configuration tests
        run: python3 -m unittest discover -s scripts/tests -v

      - name: test
        run: flutter test

      - name: production environment isolation
        run: flutter test test/core/app_environment_prod_test.dart --dart-define=APP_ENV=prod

      - name: analyze
        run: flutter analyze
