# 되돌리기 어려운 사고를 사람 손보다 먼저 잡는 자리.
#
# release.yml 과 역할이 다르다. 그쪽은 태그를 밀었을 때 설치본을 만들고,
# 이쪽은 코드를 밀 때마다 깨진 곳이 없는지만 본다.
#
# 판은 release.yml 의 FLUTTER_VERSION 과 같은 값으로 맞춘다. 검사와 배포가
# 다른 판으로 돌면, 여기서 통과한 것이 설치본에서 깨질 수 있다.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # 실행 설정 파일은 추적하지 않는다. 그런데 꾸러미 목록이 그 파일을
      # 자산으로 싣게 되어 있어, 없으면 묶는 단계에서 그대로 멈춘다.
      # 시험은 그 안의 값을 쓰지 않으므로 빈 자리만 만들어 둔다.
      - name: 실행 설정 자리 만들기
        run: |
          [ -f .env ] || cat > .env <<'EOF'
          NAVER_MAP_CLIENT_ID=
          NAVER_MAP_CLIENT_ID_FALLBACK=
          EOF

      - name: pub get
        run: flutter pub get

      - name: test
        run: flutter test

      # 지금은 오류만 막는다. 안내 6건과 경고 2건이 이미 있어서(참조되지 않는
      # 선언, 넘겨지지 않는 선택 인자 등) 전부를 막게 하면 첫 실행부터 빨간
      # 불이 켜지고, 그러면 아무도 보지 않게 된다.
      #
      # 그 8건을 정리하면 이 두 옵션을 떼어 조임을 한 단계 올릴 수 있다.
      # 떼기 전에는 새로 생긴 안내·경고가 여기서 걸리지 않는다는 점을 알고 있어야 한다.
      - name: analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
